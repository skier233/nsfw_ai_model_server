services:
  nsfw-ai-server:
    image: ai_model_server
    container_name: nsfw-ai-server
    restart: unless-stopped

  # ── NVIDIA CUDA ──
  # Build with: docker build -t ai_model_server .
  # Uncomment the deploy block and environment variables below for NVIDIA GPUs.
  #
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: all
    #          capabilities: [gpu]
    #
    #environment:
    #  - NVIDIA_VISIBLE_DEVICES=all
    #  - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video

  # ── Intel XPU ──
  # Build with: docker build -f Dockerfile-intel -t ai_model_server .
  # Uncomment the devices and group_add below for Intel GPUs.
  # Remove or comment out the NVIDIA block above.
  #
    #group_add:
    #  - "44"   # video group (for /dev/dri access)
    #devices:
    #  - /dev/dri:/dev/dri

    ports:
      - "8000:8000"
      - "7483:7483"

    volumes:
      # Named volume for media (models, data, etc.)
      - nsfw-ai-data:/media
      # Mount current directory as /app for development/config
      - .:/app:rw

volumes:
  # Use a bind mount so nsfw-ai-data maps to a host directory by default.
  # This points to the project `data/` folder. On most systems Compose
  # exposes ${COMPOSE_PROJECT_DIR}; if your environment doesn't, replace
  # the device value with an absolute path (e.g. C:/path/to/nsfw/data).
  nsfw-ai-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      # Your path to stash files
      device: C:\temp
