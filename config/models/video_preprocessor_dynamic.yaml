type: video_preprocessor
max_queue_size: null
max_batch_size: 1
instance_count: 1
frame_interval: 2
use_half_precision: false
max_pending_frames: 19200             # Max preprocessed frames held in memory before pausing to let GPU catch up. 0 = unlimited.
preprocess_backend: av_auto  # av_auto (default: seek when interval>=1s, threaded otherwise), av_seek, av, deffcode_auto, deffcode, deffcode_gpu
gpu_min_long_edge: 36000            # deffcode_auto: use GPU when video long edge >= this (0 = always GPU)